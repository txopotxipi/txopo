<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="button-styles.css" />
    <title>Slider de Fotos</title>
  </head>
  <body>
    <div class="slider">
      <div class="slider__container">
        <!-- Aquí se mostrarán las imágenes del slider -->
      </div>
      <button class="slider__button slider__button--prev">Anterior</button>
      <button class="slider__button slider__button--next">Siguiente</button>
      <button class="slider__button slider__button--stop">Detener</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>

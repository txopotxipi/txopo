<!DOCTYPE html>
<html lang=en dir=ltr>
<head>
<meta charset=utf-8>
<title>Photo Slider</title>
<link rel=stylesheet href=slider.css>
</head>
<body>
<div class=slider-container>
<div class="mySlide fade">
<img src=fotos/1.jpg alt class=img>
</div>
<div class="mySlide fade">
<img src=fotos/2.jpg alt class=img>
</div>
<div class="mySlide fade">
<img src=fotos/3.jpg alt class=img>
</div>
<div class="mySlide fade">
<img src=fotos/4.jpg alt class=img>
</div>
<div class="mySlide fade">
<img src=fotos/5.jpg alt class=img>
</div>
<div class="mySlide fade">
<img src=fotos/6.jpg alt class=img>
</div>
<a class=prev onclick=plusSlides(-1)>&#10094;</a>
<a class=next onclick=plusSlides(1)>&#10095;</a>
</div>
<script src=slider.js></script>
</body>
</html>

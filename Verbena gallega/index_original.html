<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Verbena Gallega</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="shortcut icon" href="../favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1 id="tituloAnimado" class="animate__animated animate__fadeIn"></h1>
        <button id="menuToggle" aria-label="Abrir menú">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav id="mainNav">
          <ul>
            <li>
              <a href="#galeria" class="animate__animated animate__fadeInRight"
                >Galería</a
              >
            </li>
            <li>
              <a href="#videos" class="animate__animated animate__fadeInRight"
                >Vídeos</a
              >
            </li>
            <li>
              <a href="#contacto" class="animate__animated animate__fadeInRight"
                >Contacto</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section id="galeria">
        <h2 class="animate__animated animate__fadeInLeft">
          Galería de Imágenes
        </h2>
        <div id="imagenes" class="animate__animated animate__fadeIn"></div>
      </section>
      <section id="slider">
        <button id="cerrarSlider" aria-label="Cerrar slider">×</button>
        <img id="sliderImage" src="fotos/1.jpg" alt="Imagen en el slider" />
        <div id="sliderControls">
          <button id="prevImage" aria-label="Imagen anterior">&#10094;</button>
          <button id="playPauseSlider" aria-label="Iniciar/Parar slider">
            &#9658;/&#10074;&#10074;
          </button>
          <button id="nextImage" aria-label="Siguiente imagen">&#10095;</button>
        </div>
      </section>
      <section id="videos">
        <h2 class="animate__animated animate__fadeInRight">
          Vídeos de YouTube
        </h2>
        <div
          id="videoContainer"
          class="animate__animated animate__fadeIn"
        ></div>
      </section>
      <section id="contacto">
        <h2 class="animate__animated animate__fadeInUp">Contacto</h2>
        <form
          id="formularioContacto"
          action="submit.php"
          method="post"
          class="animate__animated animate__fadeIn"
        >
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" required></textarea>
          </div>
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2024 La Verbena Gallega. Todos los derechos reservados.</p>
    </footer>
    <script src="scripts.js"></script>
  </body>
</html>
